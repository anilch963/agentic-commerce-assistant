name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (offline mode, includes RAG retrieval eval)
        run: pytest
        env:
          LLM_PROVIDER: offline

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t iphone-store-agents .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name app iphone-store-agents
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/chat -H 'content-type: application/json' \
            -d '{"message":"is the iphone 17 in stock in mumbai?"}' | grep -q "in stock in Mumbai"
