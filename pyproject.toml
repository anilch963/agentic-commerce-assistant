[project]
name = "iphone-store-agents"
version = "1.0.0"
description = "Multi-agent iPhone shopping assistant: LangGraph supervisor, 10 agents, 3 MCP servers, RAG, FastAPI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
